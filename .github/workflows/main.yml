name: RDP Self-Repeating (No Schedule)

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2019
            server: 1
          - os: windows-2019
            server: 2
          - os: windows-2019
            server: 3
          - os: windows-2019
            server: 4
          - os: windows-2019
            server: 5
          - os: windows-2019
            server: 6
          - os: windows-2019
            server: 7
          - os: windows-2019
            server: 8
          - os: windows-2019
            server: 9
          - os: windows-2019
            server: 10
          - os: windows-2022
            server: 11
          - os: windows-2022
            server: 12
          - os: windows-2022
            server: 13
          - os: windows-2022
            server: 14
          - os: windows-2022
            server: 15
          - os: windows-2022
            server: 16
          - os: windows-2022
            server: 17
          - os: windows-2022
            server: 18
          - os: windows-2022
            server: 19
          - os: windows-2022
            server: 20

    runs-on: ${{ matrix.os }}
    timeout-minutes: 2

    steps:
      - name: Setup RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force
          
          $password = ConvertTo-SecureString "admin@123" -AsPlainText -Force
          if (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "TOOLBOXLAP" -Force
          }
          New-LocalUser -Name "TOOLBOXLAP" -Password $password -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "TOOLBOXLAP"
          
          $ip = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing -TimeoutSec 10).Content.Trim()
          
          Write-Host "============================================"
          Write-Host "✅ SERVER #${{ matrix.server }} READY"
          Write-Host "🌐 IP: $ip:3389"
          Write-Host "👤 User: TOOLBOXLAP"
          Write-Host "🔑 Pass: admin@123"
          Write-Host "============================================"

      - name: Run for 60 seconds
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddSeconds(55)
          while ((Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 5
          }

      - name: Trigger Next Run
        shell: pwsh
        run: |
          Write-Host "🔄 Triggering next server..."
          # استخدام GitHub CLI لتشغيل الـ workflow مرة أخرى
          gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
